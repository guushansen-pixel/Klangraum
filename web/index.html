<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Klangraum</title>
<style>
:root {
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --bg: #12171E; --card: #1B222C; --line: #2A3441; --txt: #E8EDF2; --muted: #93A0AF;
  --acc: #3FB6A8; --good: #4CC38A; --bad: #E5674F;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--txt);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { max-width: 560px; margin: 0 auto; padding: calc(var(--sat) + 8px) 14px calc(var(--sab) + 28px); }
header { display: flex; align-items: center; gap: 8px; height: 48px; }
header h1 { font-size: 20px; margin: 0; flex: 1; }
#back { background: none; border: 0; color: var(--txt); font-size: 30px; line-height: 1; padding: 0 12px 4px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
.card.off { opacity: .62; }
.card h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.muted { color: var(--muted); } .small { font-size: 13px; } .bad { color: var(--bad); }
button, .chip { font: inherit; color: var(--txt); background: #26303D; border: 1px solid var(--line); border-radius: 11px; padding: 9px 12px; }
button.primary { background: var(--acc); border-color: var(--acc); color: #06201D; font-weight: 700; }
button.block { display: block; width: 100%; margin-top: 8px; }
button.ghost { background: none; }
#play { width: 100%; padding: 18px; font-size: 20px; border-radius: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip.on { background: var(--acc); border-color: var(--acc); color: #06201D; font-weight: 600; }
.row { display: flex; gap: 10px; align-items: center; } .row > .grow { flex: 1; }
.lname { font-weight: 600; flex: 1; }
label.f { display: block; margin: 8px 0 2px; font-size: 13px; color: var(--muted); }
input[type=range] { width: 100%; accent-color: var(--acc); margin: 0; height: 30px; }
input[type=text] { font: inherit; color: var(--txt); background: #0E1319; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; }
/* Schalter */
.sw { position: relative; width: 50px; height: 30px; flex: 0 0 auto; }
.sw input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; z-index: 1; }
.sw i { position: absolute; inset: 0; background: #0E1319; border: 1px solid var(--line); border-radius: 15px; }
.sw i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.sw input:checked + i { background: var(--acc); border-color: var(--acc); }
.sw input:checked + i::after { transform: translateX(20px); background: #06201D; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.modes button { text-align: left; padding: 11px 12px; line-height: 1.25; }
.modes b { display: block; } .modes span { font-size: 12px; color: var(--muted); }
.bigno { font-size: 64px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: #0E1319; border-radius: 4px; overflow: hidden; margin: 14px 0; } .bar i { display: block; height: 100%; width: 0; background: var(--acc); }

#pad { position: relative; height: 56vh; min-height: 300px; border-radius: 14px; border: 1px solid var(--line); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background: linear-gradient(180deg, #23404A 0%, #1B222C 55%, #141A22 100%); }
#pad .col { position: absolute; top: 0; bottom: 0; border-left: 1px solid rgba(255,255,255,.06); }
#pad .col.root { border-left-color: rgba(63,182,168,.5); }
#pad .dot { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: radial-gradient(circle, rgba(63,182,168,.9), rgba(63,182,168,0) 70%); pointer-events: none; }
#pad .hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--muted); padding: 20px; pointer-events: none; }
ul { margin: 6px 0; padding-left: 20px; } li { margin: 4px 0; }

#night[hidden], #modal[hidden] { display: none; }
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
#modal > div { background: var(--card); width: 100%; max-width: 560px; border-radius: 16px 16px 0 0; padding: 16px 16px calc(var(--sab) + 16px); }
#modal h3 { margin: 0 0 8px; }
.btns { display: flex; gap: 8px; margin-top: 12px; } .btns button { flex: 1; }
</style>
</head>
<body>
<div id="app">
  <header><button id="back" aria-label="Zurück">‹</button><h1 id="title">Klangraum</h1></header>
  <main id="view"></main>
</div>
<div id="night" hidden><div id="night-t"></div></div>
<div id="modal" hidden><div id="modal-in"></div></div>

<script>
'use strict';
// =====================================================================
// Klangraum: Klanglandschaften, die das Handy live erzeugt (Web Audio),
// ohne eine einzige Audiodatei. Sechs Ebenen, die sich mischen lassen.
// Aufbau: Daten -> Klangbausteine (rein) -> Ebenen -> Wiedergabe
//         -> Ansichten -> Selbsttest (krTests, ?debug=1). Details: README.md.
// =====================================================================
const $ = id => document.getElementById(id);
const NATIVE = window.KrAndroid;

// ---------------------------------------------------------------- Klangbausteine
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
// Regler 0..1 -> Verstaerkung. Quadratisch, weil das Ohr Lautstaerke nicht linear hoert.
function volGain(v) { return clamp(v, 0, 1) * clamp(v, 0, 1); }
// Regler 0..1 -> Grenzfrequenz 200..12000 Hz (gleichmaessig in Oktaven).
function tonToHz(t) { return 200 * Math.pow(60, clamp(t, 0, 1)); }
function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16];        // Dur-Pentatonik ueber dem Grundton
function bellHz(root, step) { return root * 4 * Math.pow(2, PENTA[step % PENTA.length] / 12); }
// Binaurale Schwebung nach sec Sekunden: fest, oder linear von beat nach ziel in dauer Minuten.
function beatAt(p, sec) { return p.dauer > 0 ? p.beat + (p.ziel - p.beat) * clamp(sec / (p.dauer * 60), 0, 1) : p.beat; }
// Ausblenden am Ende des Timers: in der letzten Minute linear auf 0.
function timerGain(remainSec, vol) { return remainSec <= 0 ? 0 : vol * Math.min(1, remainSec / 60); }
// Rauschen als Schleife: n Werte, an der Nahtstelle ueberblendet, auf gleiche Lautheit gebracht.
// weiss = alle Frequenzen gleich, rosa = hoehenaermer, braun = dumpf und tief.
function noiseData(type, n, rnd) {
  const F = Math.min(4096, n >> 2), x = new Float32Array(n + F);
  let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0;
  for (let i = 0; i < x.length; i++) {
    const w = rnd() * 2 - 1;
    if (type === 'rosa') {            // Filter nach Paul Kellet
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856; b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
      x[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362; b6 = w * 0.115926;
    } else if (type === 'braun') { last = (last + 0.02 * w) / 1.02; x[i] = last; }
    else x[i] = w;
  }
  const y = new Float32Array(n);
  for (let i = 0; i < n; i++) y[i] = x[i];
  for (let i = 0; i < F; i++) { const a = i / F; y[i] = x[i] * Math.sqrt(a) + x[n + i] * Math.sqrt(1 - a); }
  let s = 0, m = 0; for (let i = 0; i < n; i++) m += y[i]; m /= n;
  for (let i = 0; i < n; i++) { y[i] -= m; s += y[i] * y[i]; }
  const k = 0.2 / Math.sqrt(s / n || 1);
  for (let i = 0; i < n; i++) y[i] = clamp(y[i] * k, -1, 1);
  return y;
}
const noiseCache = new WeakMap();
function noiseBuffer(ac, type) {
  let c = noiseCache.get(ac); if (!c) { c = {}; noiseCache.set(ac, c); }
  if (!c[type]) {
    const n = Math.floor(ac.sampleRate * 6), buf = ac.createBuffer(2, n, ac.sampleRate);
    buf.copyToChannel(noiseData(type, n, Math.random), 0); buf.copyToChannel(noiseData(type, n, Math.random), 1);
    c[type] = buf;
  }
  return c[type];
}

// ---------------------------------------------------------------- Ebenen
// Jede Ebene: build(ac, out, p, ctx) -> {update(p), tick(now)?, stop()}.
// ac darf auch ein OfflineAudioContext sein (Selbsttest). ctx.root() liefert den Grundton.
function loopSource(ac, type) { const s = ac.createBufferSource(); s.buffer = noiseBuffer(ac, type); s.loop = true; s.start(0, Math.random() * 5); return s; }
function fadeOut(ac, g, srcs) {
  g.gain.cancelScheduledValues(ac.currentTime); g.gain.setTargetAtTime(0, ac.currentTime, 0.12);
  setTimeout(() => { srcs.forEach(s => { try { s.stop(); } catch (e) {} try { s.disconnect(); } catch (e) {} }); try { g.disconnect(); } catch (e) {} }, 900);
}
function setP(param, v, ac, tc) { param.setTargetAtTime(v, ac.currentTime, tc || 0.1); }
const ROOTS = [['C', 36], ['D', 38], ['E', 40], ['G', 43], ['A', 45]];
const BEATS = [[2, 'Delta 2'], [6, 'Theta 6'], [10, 'Alpha 10'], [16, 'Beta 16'], [40, 'Gamma 40']];
const GLIDES = [[0, 'fest'], [10, '10 min'], [20, '20 min'], [30, '30 min']];
const LAYERS = {
  noise: { name: 'Rauschen', def: { on: false, vol: 0.5, farbe: 'braun', ton: 0.55 },
    build(ac, out, p) {
      const g = ac.createGain(), f = ac.createBiquadFilter(); f.type = 'lowpass'; g.gain.value = 0; f.connect(g); g.connect(out);
      let src = null, farbe = null;
      const L = { update(q) {
        p = q;
        if (p.farbe !== farbe) { if (src) { try { src.stop(); } catch (e) {} src.disconnect(); } src = loopSource(ac, p.farbe); src.connect(f); farbe = p.farbe; }
        setP(f.frequency, tonToHz(p.ton), ac); setP(g.gain, volGain(p.vol) * 1.4, ac);
      }, stop() { fadeOut(ac, g, [src]); } };
      L.update(p); return L;
    } },
  regen: { name: 'Regen', def: { on: false, vol: 0.5, staerke: 0.5 },
    build(ac, out, p) {
      const g = ac.createGain(), hp = ac.createBiquadFilter(), gh = ac.createGain(), src = loopSource(ac, 'rosa');
      hp.type = 'highpass'; hp.frequency.value = 1500; g.gain.value = 0; src.connect(hp); hp.connect(gh); gh.connect(g); g.connect(out);
      let next = 0;
      const L = { update(q) { p = q; setP(gh.gain, 0.3 + 1.1 * p.staerke, ac); setP(g.gain, volGain(p.vol), ac); },
        // Einzelne Tropfen: kurze, hell gefilterte Rauschstoesse an zufaelligen Stellen im Stereobild.
        tick(now) {
          if (next < now) next = now;
          while (next < now + 0.3) {
            const d = ac.createBufferSource(), bp = ac.createBiquadFilter(), e = ac.createGain(), len = 0.03 + Math.random() * 0.06;
            d.buffer = noiseBuffer(ac, 'weiss'); bp.type = 'bandpass'; bp.frequency.value = 1800 + Math.random() * 5500; bp.Q.value = 1.5 + Math.random() * 3;
            e.gain.setValueAtTime(0, next); e.gain.linearRampToValueAtTime(0.25 + Math.random() * 0.6, next + 0.003); e.gain.exponentialRampToValueAtTime(0.001, next + len);
            d.connect(bp); bp.connect(e);
            if (ac.createStereoPanner) { const pan = ac.createStereoPanner(); pan.pan.value = Math.random() * 2 - 1; e.connect(pan); pan.connect(g); } else e.connect(g);
            d.start(next, Math.random() * 5, len + 0.02);
            next += -Math.log(1 - Math.random()) / (3 + 45 * p.staerke);
          }
        }, stop() { fadeOut(ac, g, [src]); } };
      L.update(p); return L;
    } },
  wellen: { name: 'Wellen', def: { on: false, vol: 0.6, tempo: 0.4 },
    build(ac, out, p) {
      const g = ac.createGain(), f = ac.createBiquadFilter(), gw = ac.createGain(), src = loopSource(ac, 'braun');
      const l1 = ac.createOscillator(), l2 = ac.createOscillator(), a1 = ac.createGain(), a2 = ac.createGain(), af = ac.createGain();
      f.type = 'lowpass'; f.frequency.value = 650; gw.gain.value = 0.5; g.gain.value = 0; a1.gain.value = 0.3; a2.gain.value = 0.15; af.gain.value = 350;
      src.connect(f); f.connect(gw); gw.connect(g); g.connect(out);
      l1.connect(a1); l2.connect(a2); a1.connect(gw.gain); a2.connect(gw.gain); l1.connect(af); af.connect(f.frequency); l1.start(); l2.start();
      const L = { update(q) { p = q; const per = 14 - 8 * p.tempo; setP(l1.frequency, 1 / per, ac); setP(l2.frequency, 1 / (per * 1.37), ac); setP(g.gain, volGain(p.vol) * 2.4, ac); },
        stop() { fadeOut(ac, g, [src, l1, l2]); } };
      L.update(p); return L;
    } },
  drone: { name: 'Klangteppich', def: { on: false, vol: 0.5, root: 45, hell: 0.3 },
    build(ac, out, p) {
      const g = ac.createGain(), f = ac.createBiquadFilter(), lfo = ac.createOscillator(), la = ac.createGain();
      f.type = 'lowpass'; g.gain.value = 0; lfo.frequency.value = 0.07; la.gain.value = 120; lfo.connect(la); la.connect(f.frequency); lfo.start(); f.connect(g); g.connect(out);
      const parts = [[1, 'sine', 0.5], [1.003, 'triangle', 0.22], [1.5, 'sine', 0.2], [2, 'sine', 0.13]].map(d => {
        const o = ac.createOscillator(), a = ac.createGain(); o.type = d[1]; a.gain.value = d[2]; o.frequency.value = midiHz(p.root) * d[0]; o.connect(a); a.connect(f); o.start(); return { o, mult: d[0] };
      });
      const L = { update(q) { p = q; parts.forEach(x => setP(x.o.frequency, midiHz(p.root) * x.mult, ac, 0.4)); setP(f.frequency, 300 + 2200 * p.hell, ac); setP(g.gain, volGain(p.vol) * 0.7, ac); },
        stop() { fadeOut(ac, g, parts.map(x => x.o).concat([lfo])); } };
      L.update(p); return L;
    } },
  glocken: { name: 'Glocken', def: { on: false, vol: 0.5, dichte: 0.4 },
    build(ac, out, p, ctx) {
      const g = ac.createGain(), dl = ac.createDelay(1), fb = ac.createGain(), lp = ac.createBiquadFilter();
      g.gain.value = 0; dl.delayTime.value = 0.37; fb.gain.value = 0.42; lp.type = 'lowpass'; lp.frequency.value = 2600;
      dl.connect(fb); fb.connect(dl); dl.connect(lp); lp.connect(g); g.connect(out);
      let next = 0;
      const L = { update(q) { p = q; setP(g.gain, volGain(p.vol) * 0.8, ac); },
        tick(now) {
          if (next < now) next = now + 0.2;
          while (next < now + 0.3) {
            const hz = bellHz(midiHz(ctx.root()), Math.floor(Math.random() * PENTA.length)), e = ac.createGain(), dec = 2 + Math.random() * 2.5;
            e.gain.setValueAtTime(0, next); e.gain.linearRampToValueAtTime(0.22 + Math.random() * 0.2, next + 0.012); e.gain.exponentialRampToValueAtTime(0.0008, next + dec);
            [[1, 1], [2.005, 0.16]].forEach(h => { const o = ac.createOscillator(), a = ac.createGain(); o.frequency.value = hz * h[0]; a.gain.value = h[1]; o.connect(a); a.connect(e); o.start(next); o.stop(next + dec + 0.05); });
            e.connect(g); e.connect(dl);
            next += (6 - 5 * p.dichte) * (0.4 + Math.random() * 1.2);
          }
        }, stop() { fadeOut(ac, g, []); } };
      L.update(p); return L;
    } },
  // beat = Schwebung am Anfang, traeger = Grundton, dauer > 0 = die Schwebung gleitet
  // in so vielen Minuten zum Wert ziel (z. B. von 10 Hz auf 2 Hz zum Einschlafen).
  binaural: { name: 'Binaurale Beats', def: { on: false, vol: 0.4, beat: 6, traeger: 180, ziel: 2, dauer: 0 },
    build(ac, out, p) {
      const g = ac.createGain(), m = ac.createChannelMerger(2), l = ac.createOscillator(), r = ac.createOscillator();
      g.gain.value = 0; l.frequency.value = p.traeger; r.frequency.value = p.traeger + p.beat;
      l.connect(m, 0, 0); r.connect(m, 0, 1); m.connect(g); g.connect(out); l.start(); r.start();
      let t0 = ac.currentTime, key = '';
      const L = { now: p.beat,
        update(q) {
          p = q; const k = p.beat + '|' + p.ziel + '|' + p.dauer;
          if (k !== key) { key = k; t0 = ac.currentTime; }        // Verlauf neu starten, wenn er geaendert wurde
          setP(l.frequency, p.traeger, ac); setP(g.gain, volGain(p.vol) * 0.45, ac); L.tick(ac.currentTime);
        },
        tick(now) { L.now = beatAt(p, now - t0); setP(r.frequency, p.traeger + L.now, ac, 0.3); },
        stop() { fadeOut(ac, g, [l, r]); } };
      L.update(p); return L;
    } },
};
const ORDER = ['noise', 'regen', 'wellen', 'drone', 'glocken', 'binaural'];
// Mischpult-Ausgang: Begrenzer, damit mehrere laute Ebenen nicht uebersteuern.
function makeMaster(ac) {
  const g = ac.createGain(), c = ac.createDynamicsCompressor();
  c.threshold.value = -12; c.knee.value = 10; c.ratio.value = 12; c.attack.value = 0.01; c.release.value = 0.3;
  // Der Kompressor regelt nur nach; die Kennlinie dahinter ist die harte Grenze
  // (weich bis 0,98, darueber abgeschnitten), damit nichts verzerrt aus dem Lautsprecher kommt.
  const sh = ac.createWaveShaper(), curve = new Float32Array(2049);
  for (let i = 0; i < curve.length; i++) { const x = i / 1024 - 1; curve[i] = 0.98 * Math.tanh(1.6 * x) / Math.tanh(1.6); }
  sh.curve = curve;
  g.gain.value = 0; g.connect(c); c.connect(sh); sh.connect(ac.destination); return g;
}

// ---------------------------------------------------------------- Daten
const K = { set: 'klangraum.settings.v1' };
function defLayers() { const o = {}; ORDER.forEach(id => { o[id] = Object.assign({}, LAYERS[id].def); }); return o; }
// Mischung aus einer Kurzform bauen: nur genannte Ebenen sind an.
function mix(spec) { const o = defLayers(); Object.keys(spec).forEach(id => { Object.assign(o[id], spec[id], { on: true }); }); return o; }
const PRESETS = [
  { name: 'Schlaf', layers: mix({ noise: { vol: 0.45, farbe: 'braun', ton: 0.45 }, wellen: { vol: 0.55, tempo: 0.25 } }) },
  { name: 'Regen', layers: mix({ regen: { vol: 0.6, staerke: 0.55 }, noise: { vol: 0.3, farbe: 'braun', ton: 0.35 } }) },
  { name: 'Fokus', layers: mix({ noise: { vol: 0.5, farbe: 'rosa', ton: 0.6 }, binaural: { vol: 0.3, beat: 16 } }) },
  { name: 'Meditation', layers: mix({ drone: { vol: 0.5, root: 45, hell: 0.3 }, glocken: { vol: 0.45, dichte: 0.35 }, binaural: { vol: 0.25, beat: 6 } }) },
  { name: 'Meer', layers: mix({ wellen: { vol: 0.75, tempo: 0.45 }, glocken: { vol: 0.25, dichte: 0.15 } }) },
  { name: 'Einschlafen', layers: mix({ noise: { vol: 0.4, farbe: 'braun', ton: 0.4 }, binaural: { vol: 0.3, beat: 10, ziel: 2, dauer: 20, traeger: 150 } }) }];
const DEFAULT_SETTINGS = { schema: 1, vol: 0.7, timerMin: 0, layers: PRESETS[0].layers, own: [] };
function load(k, fb) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? fb : v; } catch (e) { return fb; } }
let saveOk = true;
function save() { try { localStorage.setItem(K.set, JSON.stringify(S)); } catch (e) { saveOk = false; } }
// Gespeicherte Mischung mit den Vorgaben auffuellen (neue Ebenen oder Regler nach einem Update).
function normLayers(l) { const o = defLayers(); ORDER.forEach(id => { if (l && l[id]) Object.assign(o[id], l[id]); }); return o; }
const S = Object.assign({}, DEFAULT_SETTINGS, load(K.set, {}));
S.dirigent = Object.assign({ ziel: 6, min: 10, log: [] }, S.dirigent || {});
S.flow = Object.assign({ fokus: 25, pause: 5, runden: 2, mix: 'b:Fokus', pauseMix: '', log: [] }, S.flow || {});
S.puls = Object.assign({ bpm: 70, modus: 'ruhe', ziel: 60, min: 10 }, S.puls || {});
S.maler = Object.assign({ teppich: true }, S.maler || {});
S.layers = normLayers(S.layers); S.own = (S.own || []).map(p => ({ name: String(p.name), layers: normLayers(p.layers) }));

// ---------------------------------------------------------------- Wiedergabe
// over = Ebenen eines Modus (Flow-Timer) statt der Mischung von der Startseite; fade = Faktor 0..1 obendrauf.
const E = { ac: null, master: null, live: {}, playing: false, timer: 0, end: 0, stopTo: 0, over: null, fade: 1, hold: 0 };
const curLayers = () => E.over || S.layers;
const ctxApi = { root: () => curLayers().drone.root };
// Klang bereitstellen. Ebenen einer eben gestoppten Mischung sofort abbauen, statt sie unter dem neuen Klang weiterlaufen zu lassen.
function ensureAudio() {
  clearTimeout(E.stopTo);
  if (!E.ac) { E.ac = new (window.AudioContext || window.webkitAudioContext)(); E.master = makeMaster(E.ac); }

  bus.connect(E.master); bus.connect(send); send.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(E.master);
